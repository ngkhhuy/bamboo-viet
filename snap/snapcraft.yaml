name: bamboo-viet
base: core22
version: '1.0.1'
summary: Bộ gõ tiếng Việt hiện đại cho Linux (IBus & Fcitx5)
description: |
  🎋 Bamboo Viet là bộ gõ tiếng Việt thế hệ mới cho Linux (hỗ trợ cả IBus và Fcitx5).
  - Sửa dứt điểm lỗi lặp từ khi nhấn Enter trong các ứng dụng Chat (Telegram, Slack, Messenger, Zalo).
  - Tối ưu hóa chuyên sâu cho Terminal & VS Code Integrated Terminal.
  - Tự động khôi phục từ tiếng Anh (linux, box, index) khi kết thúc từ.
  - Đi kèm Bảng điều khiển GUI đa tab chuẩn phong cách UniKey tiện dụng.
  - Đạt chuẩn 100% độ chính xác kiểm thử Fuzzer tự động.

grade: stable
confinement: classic

apps:
  bamboo-viet-gui:
    command: usr/bin/bamboo-viet-gui

  bamboo-viet-config:
    command: usr/bin/bamboo-viet-config

  bamboo-viet-fuzzer:
    command: usr/bin/bamboo-viet-fuzzer

parts:
  bamboo-viet:
    plugin: make
    source: .
    build-packages:
      - gcc
      - g++
      - make
      - golang-go
      - libx11-dev
      - libxtst-dev
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-gtk-3.0
