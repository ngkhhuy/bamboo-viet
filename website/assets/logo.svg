<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bambooGrad)" filter="url(#glow)"/>
  
  <!-- Bamboo Stalks Motif -->
  <path d="M12 8 L12 40 M12 18 L16 16 M12 28 L8 26" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
  <path d="M36 8 L36 40 M36 20 L40 18 M36 30 L32 28" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>

  <!-- Centered Iconic 'V' (Vietnamese Input) -->
  <path d="M16 16 C16 16 19 32 24 33 C29 32 32 16 32 16" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Accent Dot / Star -->
  <circle cx="24" cy="14" r="2.5" fill="#facc15" />
</svg>
